version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # This is a template with no lockfile. Raising *version floors* in
    # pyproject.toml over-constrains every downstream consumer, so ignore
    # bumps for optional-extra packages that no template code imports.
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "opencv-python"
      - dependency-name: "pillow"
      - dependency-name: "setuptools"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Uncomment in downstream projects that have a web/ workspace.
  # Dependabot errors on a configured directory that does not exist,
  # so the entry cannot be enabled in the template itself.
  # - package-ecosystem: npm
  #   directory: "/web"
  #   schedule:
  #     interval: weekly
