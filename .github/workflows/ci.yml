name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # ready_for_review is added for the `review` job below: a draft PR
    # gets no Claude review, so the switch to ready must trigger a run.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install project with canonical extras
        run: uv pip install --system -e ".[dev,claude,jira]"

      - name: Run lint, type checks, and tests
        run: make check

  # Lints every workflow file's YAML *and* GitHub Actions expressions
  # (e.g. `if:`/`needs:` mistakes like a job's own `if:` silently
  # dropping the implicit success()-of-needs guard) -- ruff/mypy/pytest
  # never touch .github/workflows/, so this is the only check that would
  # have caught that class of bug before merge.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned tag: Dependabot does not track docker:// action refs, so
      # `latest` would float silently. Bump by hand when upgrading.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # Runs only when the repo has a web/ workspace; otherwise every step
  # is skipped and the job still reports green, so it is safe to mark
  # as a required check. Job-level `if: hashFiles(...)` cannot be used
  # here — it evaluates before checkout and is always empty.
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect web workspace
        id: detect
        run: echo "exists=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.detect.outputs.exists == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        if: steps.detect.outputs.exists == 'true'
        working-directory: web
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  # Automatic PR review with the official anthropics/claude-code-action and
  # the bundled code-review plugin -- the CI counterpart of the local
  # /pr-review command. It is a gate-ordered job, not a gate: `needs:
  # checks` means a PR that fails lint/types/tests is sent back to the
  # author by `checks` alone and never spends a billable review on code
  # that will change anyway. Keep it advisory -- never a required check.
  #
  # Each run is a billable Claude API call, so the job skips itself until
  # a human has added the ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN,
  # from `claude setup-token`) repository secret -- see docs/TEMPLATE_INIT.md
  # Phase 0. The secret alone is not enough: the Claude GitHub App must be
  # installed on the repo too (`/install-github-app` does both), or the
  # action cannot mint a token that posts comments and the job fails
  # instead of skipping. GitHub withholds secrets from fork PRs and
  # Dependabot, so those are skipped as well.
  #
  # `success()` is spelled out: a job-level `if:` replaces the implicit
  # success()-of-needs guard, and without it the review would run on a
  # red `checks`. `id-token: write` is what lets the action authenticate
  # as the Claude GitHub App; `--allowedTools` must name the
  # inline-comment MCP tool or the review only lands in the run log.
  # Setup docs: https://code.claude.com/docs/en/github-actions
  review:
    needs: checks
    if: success() && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      HAS_SECRET: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Check for a review credential
        if: env.HAS_SECRET != 'true'
        run: echo "No ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN secret -- skipping Claude review."

      - name: Checkout repository
        if: env.HAS_SECRET == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review the PR
        if: env.HAS_SECRET == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The inline-comment tool posts findings; the gh calls let the
          # reviewer read the PR on a depth-1 checkout and fall back to a
          # summary comment when nothing is inline-worthy.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
