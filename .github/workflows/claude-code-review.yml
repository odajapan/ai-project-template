name: Claude Code Review

# Automatic PR review with the official anthropics/claude-code-action and the
# bundled code-review plugin -- the CI counterpart of the local /pr-review
# command. Each run is a billable Claude API call, so the job skips itself
# until a human has added the ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN,
# from `claude setup-token`) repository secret -- see docs/TEMPLATE_INIT.md
# Phase 0. GitHub withholds secrets from fork PRs and Dependabot, so those
# are skipped as well.
#
# `id-token: write` is what lets the action authenticate as the Claude GitHub
# App; `--allowedTools` must name the inline-comment MCP tool or the review
# only lands in the run log. Setup docs: https://code.claude.com/docs/en/github-actions

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      HAS_SECRET: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Check for a review credential
        if: env.HAS_SECRET != 'true'
        run: echo "No ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN secret -- skipping Claude review."

      - name: Checkout repository
        if: env.HAS_SECRET == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review the PR
        if: env.HAS_SECRET == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
