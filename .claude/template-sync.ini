# Baseline for /template-sync (docs/TEMPLATE_SYNC.md). git-config syntax so
# shell hooks can read it with `git config -f .claude/template-sync.ini <key>`.
#
#   template.commit   the template commit up to which changes were reviewed
#                     (adopted or deliberately skipped). Empty = not
#                     initialized; every drift check is then a no-op, which
#                     is the state the template repo itself ships in.
#   template.syncedAt date template.commit was last advanced (YYYY-MM-DD)
#   [skipped "<sha7>"] one entry per template PR reviewed and not adopted,
#                     with the reason — the ledger that answers "why does
#                     this project not have X" without re-reviewing.
#
# /init-from-template (Phase 0) runs `/template-sync --init` to fill in
# template.commit. Existing downstream projects run it once by hand.
[template]
	repo = odajapan/ai-project-template
	ref = main
	commit =
	syncedAt =
