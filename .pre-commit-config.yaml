repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: check-added-large-files

  # ruff and mypy run from the project environment (`language: system`) so
  # pre-commit judges with exactly the versions `make check` and CI use. The
  # pinned-rev mirrors drifted: a ruff fixed by the hook could still fail
  # `make lint`, and mirrors-mypy runs in an isolated env without the
  # project's dependencies, so its verdict differed from `make typecheck`.
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check --fix
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (make typecheck)
        entry: mypy src scripts
        language: system
        pass_filenames: false
        types_or: [python, pyi]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.20.0
    hooks:
      - id: pyupgrade
        args: [--py312-plus]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # Secret scanning. Note: builds from source (language: golang), so a
  # Go toolchain is required wherever `make precommit` runs.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
